<!--
  PROTOTYPE PLAN: Three radically different UI variants of the K for Contact web/PWA app (Variant A: Katjing Wallet & Pass App, Variant B: Fritidsbidraget Civic & Enterprise Portal, Variant C: K for Contact Next-Gen Bento Matrix), switchable via ?variant=A|B|C and a floating bottom bar.
  THROWAAWAY PROTOTYPE — built per .agents/skills/prototype/UI.md
-->
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e2a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="K for Contact" />
  <link rel="manifest" href="manifest.json" />
  <title>K for Contact — NewSeed App Family UI Prototype (?variant=A|B|C)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Montserrat:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* === Katjing tokens (katjing.newseed.se) === */
      --katjing-bg: #faf9f5;
      --katjing-surface: #f1f0e8;
      --katjing-border: #deded2;
      --katjing-forest: #4f6d32;
      --katjing-forest-dark: #3b5324;
      --katjing-gold: #e8c96e;
      --katjing-mint: #b8cda3;

      /* === Fritidsbidraget tokens (fritidsbidraget.se) === */
      --fb-canvas: #f9fafb;
      --fb-royal: #003399;
      --fb-navy: #001f3f;
      --fb-slate-navy: #1e2a4a;
      --fb-info-bg: #ebf5ff;
      --fb-info-border: #cfe4ff;

      /* === K for Contact tokens (kforcontact.com & app.kforcontact.com) === */
      --kfc-cyan: #30a4dc;
      --kfc-deep-cyan: #008cd3;
      --kfc-indigo: #3e5dbc;
      --kfc-violet: #7961aa;
      --kfc-gradient: linear-gradient(125deg, #30a4dc 0%, #3e5dbc 55%, #7961aa 100%);
      --kfc-club-gradient: linear-gradient(125deg, #4f6d32 0%, #2d6a4f 55%, #30a4dc 100%);
      --kfc-temp-gradient: linear-gradient(125deg, #7961aa 0%, #b45309 100%);

      /* === Semantic family tokens === */
      --sem-green-bg: #ecfdf5;
      --sem-green-text: #15803d;
      --sem-green-border: #bbf7d0;
      --sem-amber-bg: #fffbeb;
      --sem-amber-text: #b45309;
      --sem-amber-border: #fde68a;
      --sem-red-bg: #fef2f2;
      --sem-red-text: #dc2626;
      --sem-red-border: #fecaca;

      /* === Shadows === */
      --shadow-card: 0 1px 2px rgba(20, 24, 40, 0.06), 0 12px 32px -18px rgba(20, 24, 40, 0.25);
      --shadow-lift: 0 2px 4px rgba(20, 24, 40, 0.08), 0 24px 48px -24px rgba(20, 24, 40, 0.35);

      /* === Typography === */
      --font-display: 'Bricolage Grotesque', 'Montserrat', system-ui, -apple-system, sans-serif;
      --font-geometric: 'Montserrat', system-ui, -apple-system, sans-serif;
      --font-sans: 'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      color: #18202c;
      background: #dfe5ec;
      min-height: 100vh;
      padding-bottom: 96px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select {
      font-family: inherit;
    }

    /* === PROTOTYPE TELEMETRY BAR (Rule 5: Surface the state) === */
    .proto-telemetry-bar {
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 900;
    }
    .proto-telemetry-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .proto-badge {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .proto-state-pill {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .proto-state-pill strong {
      color: #38bdf8;
    }
    .proto-controls-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .proto-ctrl-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .proto-ctrl-btn:hover {
      background: #334155;
    }
    .proto-ctrl-btn.active {
      background: #30a4dc;
      border-color: #38bdf8;
      color: #ffffff;
    }
    @media (max-width: 680px) {
      .proto-state-pill.hide-on-small {
        display: none;
      }
    }

    /* === SHARED NEWSEED APP FAMILY BAR === */
    .family-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #475569;
      flex-wrap: wrap;
      gap: 8px;
    }
    .family-apps {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .family-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #64748b;
    }
    .family-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .family-chip.kfc { background: #ebf5ff; color: #005a9e; border-color: #bae6fd; }
    .family-chip.katjing { background: #f1f0e8; color: #4f6d32; border-color: #deded2; }
    .family-chip.fb { background: #f1f5f9; color: #003399; border-color: #cbd5e1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* === PWA PHONE SHELL SIMULATION === */
    .viewport-wrapper {
      width: 100%;
      transition: max-width 0.25s ease, margin 0.25s ease;
    }
    .viewport-wrapper.pwa-mobile {
      width: 100%;
      max-width: 412px;
      margin: 16px auto 28px;
      border-radius: 42px;
      border: 10px solid #0f172a;
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.35), 0 0 0 2px #334155;
      overflow-x: hidden;
      background: #ffffff;
      position: relative;
    }
    @media (max-width: 480px) {
      .viewport-wrapper.pwa-mobile {
        max-width: 100%;
        margin: 0;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
    .pwa-status-bar {
      display: none;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 22px 8px;
      font-size: 11px;
      font-weight: 700;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 120;
    }
    .viewport-wrapper.pwa-mobile .pwa-status-bar {
      display: flex;
    }
    .pwa-notch {
      width: 80px;
      height: 15px;
      background: #000;
      border-radius: 99px;
    }
    .pwa-home-indicator {
      display: none;
      background: inherit;
      padding: 10px 0 8px;
      justify-content: center;
      align-items: center;
    }
    .viewport-wrapper.pwa-mobile .pwa-home-indicator {
      display: flex;
    }
    .pwa-home-bar {
      width: 120px;
      height: 5px;
      border-radius: 99px;
      background: rgba(15, 23, 42, 0.25);
    }

    /* === UTILITIES & SHARED BADGES === */
    .marker-underline {
      background: linear-gradient(180deg, transparent 62%, var(--katjing-gold) 62%);
      padding: 0 2px;
    }
    .k-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--kfc-gradient);
      color: #fff;
      font-family: var(--font-geometric);
      font-weight: 800;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(48, 164, 220, 0.35);
      flex-shrink: 0;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
    }
    .chip-green { background: var(--sem-green-bg); color: var(--sem-green-text); border: 1px solid var(--sem-green-border); }
    .chip-amber { background: var(--sem-amber-bg); color: var(--sem-amber-text); border: 1px solid var(--sem-amber-border); }
    .chip-red { background: var(--sem-red-bg); color: var(--sem-red-text); border: 1px solid var(--sem-red-border); }
    .chip-blue { background: var(--fb-info-bg); color: var(--fb-royal); border: 1px solid var(--fb-info-border); }
    .chip-purple { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }

    .katjing-btn {
      border-radius: 25px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.14s, background 0.14s;
      white-space: nowrap;
    }
    .katjing-btn:active { transform: scale(0.98); }
    .katjing-btn.primary-club { background: var(--katjing-forest); color: var(--katjing-bg); }
    .katjing-btn.primary-corp { background: var(--fb-slate-navy); color: #ffffff; }
    .katjing-btn.primary-cyan { background: var(--kfc-deep-cyan); color: #ffffff; }
    .katjing-btn.danger { background: #dc2626; color: #ffffff; }
    .katjing-btn.secondary { background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; }

    /* Inline Live Editor Bar */
    .live-edit-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
      background: #ffffff;
    }
    .live-edit-input:focus {
      outline: 2px solid var(--kfc-cyan);
      border-color: transparent;
    }

    /* Simulated Recipient Phone Card (Q4 & Q8: "Mottagarens Vy") */
    .recipient-phone-preview {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 24px;
      padding: 14px;
      border: 3px solid #334155;
      box-shadow: var(--shadow-lift);
    }
    .recipient-phone-inner {
      background: #ffffff;
      color: #0f172a;
      border-radius: 16px;
      padding: 14px;
    }
    .recipient-field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 6px;
      font-size: 12px;
    }

    /* =====================================================================
       VARIANT A: "KATJING WALLET & PASS APP" (Tactile Mobile-First Passbook)
       ===================================================================== */
    .variant-a {
      background: var(--katjing-bg);
      color: #1e241b;
      min-height: calc(100vh - 80px);
      padding-bottom: 24px;
    }
    .va-header {
      background: rgba(250, 249, 245, 0.96);
      border-bottom: 1px solid var(--katjing-border);
      padding: 12px 16px;
    }
    .va-header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .va-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .va-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--katjing-forest);
      color: var(--katjing-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 19px;
      position: relative;
      flex-shrink: 0;
    }
    .va-logo::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--katjing-gold);
      border: 2px solid var(--katjing-bg);
    }
    /* Wallet Tab Navigation Bar (Q6) */
    .va-tab-bar {
      background: var(--katjing-surface);
      border: 1px solid var(--katjing-border);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      max-width: 100%;
    }
    .va-tab-btn {
      border: none;
      background: transparent;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #4b5545;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .va-tab-btn.active {
      background: var(--katjing-forest);
      color: var(--katjing-bg);
      box-shadow: 0 2px 8px rgba(79, 109, 50, 0.28);
    }

    /* Swipeable / Tappable Wallet Pass Deck (Q7) */
    .va-pass-deck-switcher {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .va-deck-tab {
      padding: 9px 10px;
      border-radius: 14px;
      border: 2px solid var(--katjing-border);
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      min-width: 0;
    }
    .va-deck-tab.active-club { border-color: var(--katjing-forest); background: #f4f7ef; }
    .va-deck-tab.active-corporate { border-color: var(--kfc-deep-cyan); background: #f0f9ff; }
    .va-deck-tab.active-temp { border-color: var(--kfc-violet); background: #faf5ff; }

    .va-container {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 20px;
    }
    .va-pass-card {
      background: #ffffff;
      border: 1px solid var(--katjing-border);
      border-radius: 22px;
      box-shadow: var(--shadow-lift);
      overflow: hidden;
    }
    .va-pass-banner {
      padding: 18px;
      color: #ffffff;
      background: var(--kfc-club-gradient);
    }
    .va-pass-banner.corporate { background: var(--kfc-gradient); }
    .va-pass-banner.temp { background: var(--kfc-temp-gradient); }
    .va-pass-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .va-pass-pill {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .va-pass-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .va-avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #ffffff;
      color: var(--fb-slate-navy);
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .va-pass-body { padding: 16px 18px; }

    /* Hero 2-Second Share QR Strip at Top of Pass (Q3 & Q7) */
    .va-hero-qr-strip {
      background: var(--katjing-surface);
      border: 1px solid var(--katjing-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .va-qr-box {
      width: 88px;
      height: 88px;
      background: #ffffff;
      border-radius: 12px;
      padding: 6px;
      border: 1px solid var(--katjing-border);
      flex-shrink: 0;
    }
    .va-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .va-field-chip {
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid var(--katjing-border);
      background: #faf9f5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .va-field-chip.shared {
      background: #ffffff;
      border-color: var(--katjing-forest);
      box-shadow: 0 2px 5px rgba(79, 109, 50, 0.08);
    }
    .va-field-chip.hidden-field {
      opacity: 0.52;
      background: #f3f2ec;
    }
    .va-section-card {
      background: #ffffff;
      border: 1px solid var(--katjing-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }

    /* Variant A Mobile & PWA Shell Overrides */
    .viewport-wrapper.pwa-mobile .va-header-inner {
      flex-direction: column;
      align-items: stretch;
    }
    .viewport-wrapper.pwa-mobile .va-tab-bar {
      width: 100%;
      justify-content: space-between;
    }
    .viewport-wrapper.pwa-mobile .va-tab-btn {
      padding: 7px 9px;
      font-size: 11px;
      flex: 1;
      text-align: center;
    }
    .viewport-wrapper.pwa-mobile .va-container {
      grid-template-columns: 1fr;
      padding: 12px;
    }
    .viewport-wrapper.pwa-mobile .va-field-grid {
      grid-template-columns: 1fr;
    }
    .viewport-wrapper.pwa-mobile .va-hero-qr-strip {
      flex-direction: column;
      text-align: center;
    }
    @media (max-width: 840px) {
      .va-container { grid-template-columns: 1fr; }
    }
    @media (max-width: 540px) {
      .va-field-grid { grid-template-columns: 1fr; }
      .va-hero-qr-strip { flex-direction: column; text-align: center; }
    }

    /* =====================================================================
       VARIANT B: "FRITIDSBIDRAGET CIVIC & ENTERPRISE PORTAL"
       ===================================================================== */
    .variant-b {
      background: var(--fb-canvas);
      min-height: calc(100vh - 80px);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 330px;
    }
    .vb-sidebar {
      background: var(--fb-navy);
      color: #f8fafc;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      border-right: 1px solid #0f2942;
    }
    .vb-nav-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .vb-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 9px 11px;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }
    .vb-nav-item:hover { background: rgba(255,255,255,0.08); color: #ffffff; }
    .vb-nav-item.active {
      background: var(--kfc-cyan);
      color: #ffffff;
      font-weight: 700;
    }
    .vb-main {
      padding: 20px 22px;
      min-width: 0;
    }
    .vb-kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .vb-kpi-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 0;
    }
    .vb-table-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .vb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .vb-table th {
      text-align: left;
      padding: 10px 14px;
      background: #f8fafc;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;

    window.setVariant = function(v) {
      if (!VARIANTS[v]) return;
      state.variant = v;
      state.lastAction = `Bytte till Variant ${v} (${VARIANTS[v].name})`;
      const url = new URL(window.location.href);
      url.searchParams.set('variant', v);
      window.history.replaceState({}, '', url);
      renderAll();
    };

    window.setContextMode = function(ctx) {
      state.activeContext = ctx;
      // Auto-select matching sample recipient so "Mottagarens Vy" reflects the context
      const match = state.connections.find(c => c.filterUsed === ctx);
      if (match) state.selectedRecipientId = match.id;
      state.lastAction = `Valde kort: ${CONTEXT_META[ctx].label}`;
      renderAll();
    };

    window.setSubTab = function(tab) {
      state.subTab = tab;
      state.lastAction = `Vy: ${tab === 'pass' ? 'Mitt K-Kort & QR' : tab === 'recipient' ? 'Mottagarens Vy' : 'Grupper & Föreningsadmin'}`;
      renderAll();
    };

    window.toggleViewportMode = function() {
      state.viewportMode = state.viewportMode === 'responsive' ? 'pwa-mobile' : 'responsive';
      state.lastAction = state.viewportMode === 'pwa-mobile' ? '📱 Mobil PWA-vy PÅ' : '🖥️ Responsiv vy PÅ';
      renderAll();
    };

    window.toggleFieldPermission = function(profileKey, fieldId) {
      state.filters[profileKey][fieldId] = !state.filters[profileKey][fieldId];
      const enabled = state.filters[profileKey][fieldId];
      state.lastAction = `${enabled ? 'Lånar nu ut' : 'Drog tillbaka'} "${fieldId}" i ${CONTEXT_META[profileKey].label}`;
      renderAll();
    };

    window.updateOwnFieldValue = function(fieldId, newValue) {
      const f = state.fields.find(item => item.id === fieldId);
      if (!f) return;
      f.value = newValue;
      state.lastAction = `🔄 PUT /v1/profile: Uppdaterade ${f.label} → "${newValue}" (Synkat till alla K-kontakter!)`;
      renderAll();
    };

    window.cycleAvailability = function() {
      const keys = Object.keys(STATUS_MAP);
      const nextIdx = (keys.indexOf(state.availability) + 1) % keys.length;
      state.availability = keys[nextIdx];
      state.lastAction = `Status: ${STATUS_MAP[state.availability].note}`;
      renderAll();
    };

    window.selectRecipientPreview = function(connId) {
      state.selectedRecipientId = connId;
      const c = state.connections.find(x => x.id === connId);
      if (c) {
        state.lastAction = `Förhandsgranskar vad ${c.name} ser i sin telefon`;
      }
      renderAll();
    };

    window.requestConnectionRevoke = function(connId) {
      const conn = state.connections.find(c => c.id === connId);
      if (!conn) return;
      if (conn.status === 'revoked') {
        conn.status = 'active';
        state.lastAction = `✅ Återaktiverade delning med ${conn.name}`;
        renderAll();
      } else {
        state.pendingRevokeConnId = connId;
        state.lastAction = `Öppnade GDPR-återkallelse för ${conn.name}`;
        renderAll();
      }
    };

    window.confirmConnectionRevoke = function() {
      const conn = state.connections.find(c => c.id === state.pendingRevokeConnId);
      if (conn) {
        conn.status = 'revoked';
        state.selectedRecipientId = conn.id;
        state.lastAction = `🛑 DELETE /v1/connection: Återkallade ${conn.name} — 0 uppgifter kvar hos mottagaren!`;
      }
      state.pendingRevokeConnId = null;
      renderAll();
    };

    window.cancelConnectionRevoke = function() {
      state.pendingRevokeConnId = null;
      renderAll();

    // =========================================================================
    // SVG QR CODE GENERATOR
    // =========================================================================
    function renderQrSvg(accentColor = '#1e2a4a') {
      const seed = state.activeContext === 'club' ? 3 : state.activeContext === 'corporate' ? 7 : 11;
      let rects = '';
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          const isCorner = (r < 2 && c < 2) || (r < 2 && c > 4) || (r > 4 && c < 2);
          if (isCorner || ((r * 7 + c + seed) % 2 === 0)) {
            rects += `<rect x="${12 + c * 11}" y="${12 + r * 11}" width="8.5" height="8.5" rx="2" fill="${isCorner ? accentColor : '#1e293b'}" />`;
          }
        }
      }
      return `
        <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="10" fill="#ffffff"/>
          ${rects}
          <rect x="37" y="37" width="26" height="26" rx="7" fill="${accentColor}"/>
          <text x="50" y="55" text-anchor="middle" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="800" font-size="16">K</text>
        </svg>
      `;
    }

                   onclick="window.openFullscreenQr(true)">

                <button class="katjing-btn primary-cyan" style="padding:5px 10px; font-size:11px;" onclick="window.openFullscreenQr(true)">
                  🔍 Helskärms-QR

                <button class="katjing-btn secondary" style="padding:5px 9px; font-size:11px;" onclick="window.triggerFamilyToast('📥 Laddade ner mats-lind.vcf (vCard)')">

    // =========================================================================
    // VARIANT C: "K FOR CONTACT NEXT-GEN BENTO MATRIX"
    // =========================================================================
    function renderVariantC() {
      const ctx = state.activeContext;

      const matrixRowsHtml = state.fields.map(f => {
        const cOn = state.filters.club[f.id];
        const bOn = state.filters.corporate[f.id];
        const tOn = state.filters.temp[f.id];
        return `
          <tr>
            <td>

            <td style="text-align:center;">

                      onclick="window.toggleFieldPermission('club', '${f.id}')"></button>
            </td>
            <td style="text-align:center;">
              <button class="vc-matrix-toggle ${bOn ? 'on-corp' : 'off'}"
                      onclick="window.toggleFieldPermission('corporate', '${f.id}')"></button>
            </td>
            <td style="text-align:center;">
              <button class="vc-matrix-toggle ${tOn ? 'on-temp' : 'off'}"
                      onclick="window.toggleFieldPermission('temp', '${f.id}')"></button>
            </td>
          </tr>

      }).join('');

      return `
        <div class="variant-c">
          <div class="vc-shell">
            <header class="vc-floating-nav">
              <div style="display:flex; align-items:center; gap:10px; min-width:0;">
                <span class="k-badge" style="width:36px; height:36px; font-size:18px; border-radius:12px;">K</span>
                <div style="min-width:0;">
                  <div style="font-family:var(--font-display); font-weight:800; font-size:17px;">
                    K for Contact <span style="font-weight:500; font-size:12px; color:#64748b;">· Variant C (Next-Gen Bento Matrix)</span>
                  </div>
                  <div style="font-size:11.5px; color:#475569;">
                    Alla tre personas (⚽ Lag, 💼 B2B, ⏱️ Temp), live-mottagarvy och gruppadmin sida vid sida.
                  </div>
                </div>
              </div>

              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="katjing-btn ${ctx === 'club' ? 'primary-club' : 'secondary'}" onclick="window.setContextMode('club')">⚽ Lag-QR</button>
                <button class="katjing-btn ${ctx === 'corporate' ? 'primary-corp' : 'secondary'}" onclick="window.setContextMode('corporate')">💼 B2B-QR</button>
                <button class="katjing-btn ${ctx === 'temp' ? 'primary-cyan' : 'secondary'}" onclick="window.setContextMode('temp')">⏱️ Temp-QR</button>

            <div class="vc-bento-grid">

                    <span class="chip chip-blue">SAMTIDIG 3-PROFILSMATRIS (GET/POST /v1/filter)</span>
                    <h2 style="font-family:var(--font-display); font-size:19px; font-weight:800; margin-top:4px;">

                    </h2>
                  </div>
                </div>
                <div class="vc-matrix-wrap">
                  <table class="vc-matrix">
                    <thead>
                      <tr>
                        <th>Kontaktuppgift</th>
                        <th style="color:var(--katjing-forest);">⚽ Lag</th>
                        <th style="color:var(--kfc-deep-cyan);">💼 B2B</th>
                        <th style="color:var(--kfc-violet);">⏱️ Temp</th>
                      </tr>
                    </thead>
                    <tbody>${matrixRowsHtml}</tbody>
                  </table>
                </div>
              </section>

              <!-- CELL 2: 2-SECOND MULTI-PERSONA QR STUDIO (5 cols) -->
              <section class="vc-cell vc-span-5" style="background:var(--kfc-gradient); color:#ffffff; display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
                    <span class="va-pass-pill">2-SEKUNDERS QR-STUDIO</span>
                    <span class="va-pass-pill">${CONTEXT_META[ctx].label}</span>
                  </div>
                  <h2 style="font-family:var(--font-display); font-size:20px; font-weight:800;">
                    Aktiv QR: ${CONTEXT_META[ctx].badge}
                  </h2>

                  <div style="background:#ffffff; color:#0f172a; border-radius:18px; padding:14px; margin:12px 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                    <div style="width:96px; height:96px; flex-shrink:0; cursor:pointer; margin:0 auto;" onclick="window.openFullscreenQr(true)">
                      ${renderQrSvg(CONTEXT_META[ctx].color)}
                    </div>
                    <div style="flex:1; min-width:150px;">
                      <div style="font-weight:800; font-size:15px;">Mats Lind</div>
                      <div style="font-size:11.5px; color:#475569; margin-bottom:6px;">
                        Exponerar <strong>${Object.values(state.filters[ctx]).filter(Boolean).length} av ${state.fields.length}</strong> fält
                      </div>
                      <div style="display:flex; gap:5px; flex-wrap:wrap;">
                        <button class="katjing-btn primary-cyan" style="padding:5px 10px; font-size:11px;" onclick="window.openFullscreenQr(true)">
                          🔍 Helskärms-QR
                        </button>
                        <button class="katjing-btn secondary" style="padding:5px 9px; font-size:11px;" onclick="window.setShareExpiry(state.shareExpiry === '24h' ? '1h' : '24h')">
                          ⏱️ ${state.shareExpiry}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                  <span style="font-size:11.5px; font-weight:600;">${STATUS_MAP[state.availability].label}</span>
                  <button class="katjing-btn secondary" style="padding:5px 10px; font-size:11px;" onclick="window.cycleAvailability()">
                    Byt Status ↻

              <!-- CELL 3: LIVE RECIPIENT PREVIEW (6 cols) -->

              <!-- CELL 4: GROUPS & CLUB ADMIN (6 cols) -->

    }

    // =========================================================================
    // MODALS: FULLSCREEN QR (Q3/Q7) & GDPR REVOCATION SAFEGUARD (Q4/Q8)
    // =========================================================================
    function renderModals() {
      const modalRoot = document.getElementById('modal-root');
      if (state.fullscreenQrOpen) {
        const ctx = state.activeContext;
        const count = Object.values(state.filters[ctx]).filter(Boolean).length;
        modalRoot.innerHTML = `
          <div class="proto-modal-backdrop" onclick="window.openFullscreenQr(false)">
            <div class="proto-modal-card" onclick="event.stopPropagation()">
              <span class="chip chip-blue">${CONTEXT_META[ctx].label} · ${CONTEXT_META[ctx].badge}</span>
              <h2 style="font-family:var(--font-display); font-size:22px; font-weight:800; margin-top:8px;">
                Mats Lind
              </h2>
              <p style="font-size:12.5px; color:#64748b; margin-bottom:14px;">
                Skanna med mobilkameran · Lånar ut ${count} av ${state.fields.length} uppgifter (${state.shareExpiry})
              </p>
              <div style="width:220px; height:220px; margin:0 auto 16px; padding:12px; border-radius:20px; border:2px solid #e2e8f0;">
                ${renderQrSvg(CONTEXT_META[ctx].color)}
              </div>
              <div style="font-family:var(--font-mono); font-size:12px; color:#0f172a; background:#f1f5f9; padding:8px; border-radius:10px; margin-bottom:14px;">
                https://link.kforcontact.com/share/8f9a-${ctx}
              </div>
              <button class="katjing-btn primary-corp" style="width:100%; padding:11px;" onclick="window.openFullscreenQr(false)">
                Stäng Helskärms-QR
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (state.pendingRevokeConnId) {
        const conn = state.connections.find(c => c.id === state.pendingRevokeConnId);
        if (conn) {
          modalRoot.innerHTML = `
            <div class="proto-modal-backdrop" onclick="window.cancelConnectionRevoke()">
              <div class="proto-modal-card" onclick="event.stopPropagation()">
                <div style="font-size:32px; margin-bottom:6px;">🛑</div>
                <span class="chip chip-red">INVERTERAD GDPR · OMEDELBAR RADERING</span>
                <h2 style="font-family:var(--font-display); font-size:20px; font-weight:800; margin-top:8px; color:#991b1b;">
                  Återkalla dina uppgifter från ${conn.name}?
                </h2>
                <p style="font-size:13px; color:#475569; margin:10px 0 16px; line-height:1.5;">
                  När du bekräftar anropas <code>DELETE /v1/connection/{guid}</code>. Dina utlånade kontaktuppgifter raderas omedelbart från <strong>${conn.name}s</strong> K for Contact-app och synkade adressbok.
                </p>
                <div style="display:flex; gap:8px;">
                  <button class="katjing-btn secondary" style="flex:1; padding:10px;" onclick="window.cancelConnectionRevoke()">
                    Avbryt
                  </button>
                  <button class="katjing-btn danger" style="flex:1; padding:10px;" onclick="window.confirmConnectionRevoke()">
                    🛑 Ja, radera åtkomst nu
                  </button>
                </div>
              </div>
            </div>
          `;
          return;
        }
      }

      modalRoot.innerHTML = '';
    }

    // =========================================================================
    // MASTER RENDER & FLOATING SWITCHER WIRING
    // =========================================================================
    function renderAll() {
      renderTelemetry();

      const wrapper = document.getElementById('viewport-wrapper');
      wrapper.className = `viewport-wrapper ${state.viewportMode === 'pwa-mobile' ? 'pwa-mobile' : ''}`;

      const root = document.getElementById('app-root');
      if (state.variant === 'A') {
        root.innerHTML = renderVariantA();
      } else if (state.variant === 'B') {
        root.innerHTML = renderVariantB();
      } else {
        root.innerHTML = renderVariantC();
      }

      renderModals();

      const vInfo = VARIANTS[state.variant];
      document.getElementById('switcher-title').textContent = `${vInfo.key} (${vInfo.name})`;
      document.getElementById('switcher-subtitle').textContent = `?variant=${vInfo.key} · ← / → piltangenter`;

      document.querySelectorAll('.switcher-pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.variant === state.variant);
      });
    }

    function cycleVariant(delta) {
      const keys = Object.keys(VARIANTS);
      const idx = (keys.indexOf(state.variant) + delta + keys.length) % keys.length;
      window.setVariant(keys[idx]);
    }

    document.getElementById('btn-prev').addEventListener('click', () => cycleVariant(-1));
    document.getElementById('btn-next').addEventListener('click', () => cycleVariant(1));
    document.querySelectorAll('.switcher-pill-btn').forEach(btn => {
      btn.addEventListener('click', () => window.setVariant(btn.dataset.variant));
    });

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName?.toLowerCase();
      if (tag === 'input' || tag === 'textarea' || document.activeElement?.isContentEditable) {
        return;
      }
      if (e.key === 'Escape') {
        state.fullscreenQrOpen = false;
        state.pendingRevokeConnId = null;
        renderAll();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        cycleVariant(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        cycleVariant(1);
      }
    });

    renderAll();
  </script>
